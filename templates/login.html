{% extends "base.html" %}

{% block title %}Iniciar Sesión | SmartDispatch{% endblock %}

{% block content %}
<div class="w-full max-w-md my-8">

    <!-- RECUADRO FLOTANTE CON BOX SHADOW -->
    <div class="bg-white rounded-3xl floating-card-shadow border border-slate-200/60 overflow-hidden p-8 sm:p-10 transition-all duration-300">
        
        <!-- Logotipo y Encabezado del Formulario -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-headset text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Iniciar Sesión</h1>
            <p class="text-sm text-slate-500 mt-1">Plataforma de Soporte SmartDispatch</p>
        </div>

        <!-- Formulario de Acceso -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5" id="loginForm">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                    Correo Electrónico
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                    <input type="email" name="email" id="email" required
                           placeholder="usuario@empresa.com"
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
                        Contraseña
                    </label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" id="password" required
                           placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 shadow-lg shadow-blue-500/25 transition duration-150 transform hover:-translate-y-0.5">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Iniciar Sesión
            </button>
        </form>

        <!-- ENLACE DE REGISTRO -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-600">
                ¿No tienes una cuenta?
                <a href="{{ url_for('register') }}" class="font-semibold text-blue-600 hover:text-blue-700 hover:underline">
                    Regístrate aquí
                </a>
            </p>
        </div>

    </div>

</div>
{% endblock %}
