{% extends "base.html" %}

{% block title %}Crear Cuenta | SmartDispatch{% endblock %}

{% block content %}
<div class="w-full max-w-lg my-8">

    <!-- RECUADRO FLOTANTE CON BOX SHADOW -->
    <div class="bg-white rounded-3xl floating-card-shadow border border-slate-200/60 overflow-hidden p-8 sm:p-10 transition-all duration-300">
        
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Registro de Usuario</h1>
            <p class="text-xs text-slate-500 mt-1">Crea tu cuenta de Cliente o Personal de Soporte</p>
        </div>

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label for="nombre" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                    Nombre Completo *
                </label>
                <input type="text" name="nombre" id="nombre" required
                       placeholder="Ej. Roberto Morales"
                       class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Correo Electrónico *
                    </label>
                    <input type="email" name="email" id="email" required
                           placeholder="roberto@empresa.com"
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label for="rol" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Tipo de Usuario (Rol) *
                    </label>
                    <select name="rol" id="rol" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="cliente" selected>Cliente</option>
                        <option value="soporte">Personal de Soporte</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="empresa" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Empresa / Departamento
                    </label>
                    <input type="text" name="empresa" id="empresa"
                           placeholder="Ej. Logística Express"
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label for="telefono" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Teléfono de Contacto
                    </label>
                    <input type="tel" name="telefono" id="telefono"
                           placeholder="+52 55 1234 5678"
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Contraseña *
                    </label>
                    <input type="password" name="password" id="password" required minlength="6"
                           placeholder="Mínimo 6 caracteres"
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Confirmar Contraseña *
                    </label>
                    <input type="password" name="confirm_password" id="confirm_password" required minlength="6"
                           placeholder="Repite la contraseña"
                           class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 shadow-lg shadow-blue-500/25 transition">
                    <i class="fa-solid fa-check mr-2"></i> Crear Cuenta
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm text-slate-600 border-t border-slate-100 pt-5">
            ¿Ya tienes una cuenta registrada?
            <a href="{{ url_for('login') }}" class="font-semibold text-blue-600 hover:text-blue-700 hover:underline">
                Inicia sesión aquí
            </a>
        </div>
    </div>

</div>
{% endblock %}
