<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión | SmartDispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .floating-card-shadow {
            box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.22),
                        0 10px 25px -5px rgba(15, 23, 42, 0.1),
                        0 0 0 1px rgba(15, 23, 42, 0.05);
        }
    </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center font-sans text-slate-800 p-4">
    <div class="w-full max-w-md bg-white rounded-3xl floating-card-shadow p-8 text-center border border-slate-200">
        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-600 flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-wifi text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Sin Conexión a Internet</h1>
        <p class="text-sm text-slate-500 mb-6">
            SmartDispatch requiere conectividad para sincronizar con el servidor de soporte. Por favor verifica tu red e intenta nuevamente.
        </p>
        <button onclick="window.location.reload()"
                class="w-full py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/25 transition">
            <i class="fa-solid fa-rotate-right mr-2"></i> Reintentar Conexión
        </button>
    </div>
</body>
</html>
